<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Europa Chat</title>
<style>
  :root { --bg:#0A1628; --panel:#101F38; --line:#1E3253; --ink:#E8F1FA; --muted:#8FA3BF;
          --ok:#9CC9F5; --bad:#E5484D; --accent:#2F6BFF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 120px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:12px; }
  h1 { margin:0; font-size:22px; letter-spacing:.18em; }
  .sub { color:var(--muted); font-size:14px; }
  .ticker { margin-left:auto; display:flex; gap:6px; align-items:center; color:var(--muted); font-size:14px; }
  .ticker input { width:80px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 8px; text-transform:uppercase; }
  #log { margin-top:16px; display:flex; flex-direction:column; gap:14px; }
  .msg { padding:12px 14px; border-radius:10px; max-width:92%; }
  .you { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .status { font-size:12px; letter-spacing:.06em; color:var(--muted); margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { font-size:12px; border-radius:999px; padding:2px 8px; border:1px solid; }
  .chip.ok { color:var(--ok); border-color:var(--ok); }
  .chip.bad { color:var(--bad); border-color:var(--bad); }
  .chip.unchecked { color:var(--muted); border-color:var(--muted); }
  .blocked { margin-top:8px; font-size:13px; color:var(--bad); }
  .blocked s { color:var(--muted); }
  .meta { margin-top:6px; font-size:12px; color:var(--muted); }
  .news { margin:8px 0 0; padding-left:18px; font-size:13px; }
  .news a { color:var(--ok); }
  .examples { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .examples button { background:none; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px; }
  form div { max-width:760px; margin:0 auto; display:flex; gap:8px; }
  form input { flex:1; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font:inherit; }
  form button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font:inherit; cursor:pointer; }
  form button:disabled { opacity:.5; cursor:wait; }
  footer { color:var(--muted); font-size:12px; margin-top:24px; }
  .chart{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;white-space:normal}
  .ctitle{font-weight:600;font-size:14px;margin-bottom:6px}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .chart .grid{stroke:var(--line);stroke-width:1}
  .chart .base{stroke:var(--muted);stroke-width:1}
  .chart .axis{fill:var(--muted);font-size:11px}
  .chart .val{fill:var(--ink);font-size:12px;font-weight:600}
  .chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart .dotend{fill:var(--accent);stroke:var(--bg);stroke-width:2}
  .chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
  .chart .bar{fill:var(--accent)}
  .cnote{font-size:12px;color:var(--muted);margin-top:6px}
  .ctip{display:none;position:absolute;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
  .tbl{max-height:200px;overflow:auto}
  .chart table{border-collapse:collapse;font-size:13px;width:100%}
  .chart td{padding:3px 6px;border-bottom:1px solid var(--line)}
  .chart td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .ans p{margin:0 0 8px} .ans ul{margin:0 0 8px;padding-left:20px} .ans li{margin:3px 0}
  .ans .key{border-left:3px solid var(--accent);padding-left:10px}
  .ans .key b{color:var(--ok)}
  .ans .way{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
  .ans .way .wh{font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .ans .notes{margin-top:8px;font-size:12px;color:var(--muted)}
  .rephead{margin-top:12px;font-size:12px;letter-spacing:.05em;color:var(--muted)}
  .news li{margin:6px 0} .repsum{color:var(--ink);opacity:.85;font-size:13px;margin-top:2px}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .hd .co{font-weight:600;font-size:15px}
  .badge{font-size:12px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:2px 10px;white-space:nowrap}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
  .tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
  .tile .tl{font-size:12px;color:var(--muted)}
  .tile .tv{font-size:20px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
  .tile .tn{font-size:11px;color:var(--muted)}
  @media (max-width:560px){ .tiles{grid-template-columns:repeat(2,1fr)} }
  .ans .lead{font-weight:600}
  .ans li{margin:4px 0}
  .followups{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .followups button{background:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
  .followups button:hover{color:var(--ink);border-color:var(--muted)}
  .loading{display:flex;align-items:center;gap:8px;color:var(--muted)}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<main>
  <header>
    <h1>EUROPA</h1><span class="sub">Ask about a company's filings and market data. Every number is checked against its source.</span>
    <label class="ticker">Ticker (optional) <input id="ticker" value="AAPL" maxlength="6" aria-label="Ticker"></label>
  </header>
  <div class="examples" id="examples">
    <button type="button">What happened to Nvidia yesterday?</button>
    <button type="button">Bear case for Tesla with a graph</button>
    <button type="button">Show me a chart of Apple revenue and net income</button>
    <button type="button">Does Apple pay a dividend?</button>
    <button type="button">Should I buy Apple stock?</button>
    <button type="button">Is Nvidia stock overvalued?</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <footer>Callisto is Europa's research agent. Research aid, not investment advice. Data: Apple 10-K fiscal 2026 vs fiscal 2025 (public SEC filings); end-of-day market data and headlines from Massive.</footer>
</main>
<form id="f"><div><input id="q" placeholder="Ask Callisto about filings, prices or headlines…" autocomplete="off" aria-label="Question"><button id="send">Ask</button></div></form>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
const LABEL = {ANSWERED:'ANSWERED · CHECKED', I_DONT_KNOW:"I DON'T KNOW", DECLINED_ADVICE:'NO INVESTMENT ADVICE', CHAT:'CHAT'};
const STEP = {guard_advice:'guard', desk_router:'router', news_picker:'news picker', write_answer:'writer',
              skeptic_review:'skeptic', number_gate:'number gate', notices:'notices'};
function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
function add(node){ log.appendChild(node); node.scrollIntoView({behavior:'smooth', block:'end'}); }
// ---- charts (single series: one accent hue, no legend; title names it; hover tooltip; data table)
const NS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(text!=null) e.textContent=text; return e; }
function fmt(v, unit, short){
  if(unit==="pct") return v.toFixed(1)+"%";
  if(unit==="usd_per_share" || unit==="usd_price") return "$"+v.toFixed(2);
  const a=Math.abs(v); if(a>=1e12) return "$"+(v/1e12).toFixed(2)+(short?"T":" trillion"); if(a>=1e9) return "$"+(v/1e9).toFixed(1)+(short?"B":" billion"); if(a>=1e6) return "$"+(v/1e6).toFixed(1)+(short?"M":" million"); return "$"+v.toFixed(0);
}
function drawChart(c){
  const box = el("div","chart"); box.append(el("div","ctitle",c.title));
  if(c.type==="none"){ box.append(el("div","cnote",c.note||"No chart data.")); return box; }
  const W=640, H=c.type==="bar"?220:240, L=c.type==="bar"?12:58, R=14, T=14, B=28, pts=c.points, n=pts.length;
  const svg = sv("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":c.title});
  const tip = el("div","ctip"); box.style.position="relative";
  if(c.type==="line"){
    let lo=Math.min(...pts.map(p=>p.y)), hi=Math.max(...pts.map(p=>p.y)); const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
    const X=i=>L+(W-L-R)*(n===1?0.5:i/(n-1)), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
    for(let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3, y=Y(v); svg.append(sv("line",{x1:L,x2:W-R,y1:y,y2:y,class:"grid"})); svg.append(sv("text",{x:L-8,y:y+4,"text-anchor":"end",class:"axis"},fmt(v,c.unit,true))); }
    svg.append(sv("text",{x:L,y:H-8,class:"axis"},pts[0].x)); svg.append(sv("text",{x:W-R,y:H-8,"text-anchor":"end",class:"axis"},pts[n-1].x));
    svg.append(sv("path",{d:pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" "),class:"line"}));
    const last=pts[n-1]; svg.append(sv("circle",{cx:X(n-1),cy:Y(last.y),r:4,class:"dotend"}));
    const cross=sv("line",{y1:T,y2:H-B,class:"cross",visibility:"hidden"}), hov=sv("circle",{r:4.5,class:"dotend",visibility:"hidden"});
    svg.append(cross,hov);
    const hit=sv("rect",{x:L,y:T,width:W-L-R,height:H-T-B,fill:"transparent"}); svg.append(hit);
    const move=e=>{ const r=svg.getBoundingClientRect(); const x=(e.clientX-r.left)*W/r.width; const i=Math.max(0,Math.min(n-1,Math.round((x-L)/(W-L-R)*(n-1))));
      cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("visibility","visible");
      hov.setAttribute("cx",X(i)); hov.setAttribute("cy",Y(pts[i].y)); hov.setAttribute("visibility","visible");
      tip.textContent=pts[i].x+" · "+fmt(pts[i].y,c.unit); tip.style.display="block";
      const px=X(i)*r.width/W; tip.style.left=Math.min(Math.max(px-60,0),r.width-130)+"px"; tip.style.top=(Y(pts[i].y)*r.height/H-34)+"px"; };
    hit.addEventListener("pointermove",move); hit.addEventListener("pointerleave",()=>{tip.style.display="none";cross.setAttribute("visibility","hidden");hov.setAttribute("visibility","hidden");});
    const first=pts[0].y, chg=(last.y-first)/first*100;
    box.append(svg, tip, el("div","cnote",`From ${fmt(first,c.unit)} to ${fmt(last.y,c.unit)} (${chg>=0?"+":""}${chg.toFixed(1)}%) · ${c.source}`));
  } else {
    const hi=Math.max(...pts.map(p=>p.y))*1.15, bw=Math.min(120,(W-L-R)/n*0.5), Y=v=>T+(H-T-B)*(1-v/hi);
    svg.append(sv("line",{x1:L,x2:W-R,y1:H-B,y2:H-B,class:"base"}));
    pts.forEach((p,i)=>{ const cx=L+(W-L-R)*(i+0.5)/n, y=Y(p.y), h=H-B-y, r=Math.min(4,h);
      const d=`M${cx-bw/2} ${H-B} V${y+r} Q${cx-bw/2} ${y} ${cx-bw/2+r} ${y} H${cx+bw/2-r} Q${cx+bw/2} ${y} ${cx+bw/2} ${y+r} V${H-B} Z`;
      const bar=sv("path",{d,class:"bar"}); bar.append(sv("title",{},p.x+": "+fmt(p.y,c.unit))); svg.append(bar);
      svg.append(sv("text",{x:cx,y:y-6,"text-anchor":"middle",class:"val"},fmt(p.y,c.unit,true)));
      svg.append(sv("text",{x:cx,y:H-8,"text-anchor":"middle",class:"axis"},p.x)); });
    const a=pts[0].y, z=pts[n-1].y, isPct=c.unit==="pct", chg=isPct?(z-a):(z-a)/Math.abs(a)*100;
    box.append(svg, el("div","cnote",`${pts[0].x} to ${pts[n-1].x}: ${chg>=0?"+":""}${chg.toFixed(1)}${isPct?" percentage points":"%"} · ${c.source}`));
  }
  const d=el("details"); d.append(el("summary",null,"Show data table")); const tb=el("table");
  pts.slice().reverse().forEach(p=>{ const tr=el("tr"); tr.append(el("td",null,p.x), el("td",null,fmt(p.y,c.unit))); tb.append(tr); });
  const wrap=el("div","tbl"); wrap.append(tb); d.append(wrap); box.append(d);
  return box;
}
// ---- answer layout (display only: the same sentences, grouped into facts, meaning, how to decide, notes)
const NOTE_RX=/^(Market data: |Filing figures \(|For .{1,60}, ask about the share price|Recent headlines are listed|The annual figures were confirmed|The second source|Two sources disagreed|The council models|(?:Europa|Callisto)'s headlines follow|Here are recent headlines|(?:Europa|Callisto) has not verified them)/;
const WAY_RX=/^(How to judge the price:|How to gauge risk:|Things to weigh before deciding:|Analyst ratings and price targets are not|Price data shows how much|For a long-term view|If you already own the shares|(?:Europa|Callisto)'s data does not include the earnings calendar|A bear case and a bull case are two readings|For .{1,60}'s sales, profit and risks)/;
const KEY_RX=/^(What it means:|Deeper read:|Bear case:|Bull case:|Pros:|Cons:|Strengths:|Watch-outs:|To weigh:|In short:)/;
let lastQuestion='';
function renderLines(text){
  const box=el('div','ans'), ways=[], notes=[]; let list=null, leadDone=false, nextNews=false;
  String(text).split('\n').forEach(raw=>{
    const t=raw.trim(); if(!t){ list=null; return; }
    if(t.startsWith('• ')){
      if(!list){ list=el('ul',nextNews?'news':null); box.appendChild(list); nextNews=false; }
      list.appendChild(el('li',null,t.slice(2).trim())); return;
    }
    list=null;
    if(/:$/.test(t) && /^(In the news|News that could sway)/.test(t)){ box.appendChild(el('div','rephead',t)); nextNews=true; leadDone=true; return; }
    nextNews=false;
    const k=t.match(KEY_RX);
    if(k){ const p=el('p','key'); p.appendChild(el('b',null,k[1]+' ')); p.appendChild(document.createTextNode(t.slice(k[1].length).trim())); box.appendChild(p); leadDone=true; return; }
    if(NOTE_RX.test(t)){ notes.push(t); leadDone=true; return; }
    if(WAY_RX.test(t)){ ways.push(t); leadDone=true; return; }
    box.appendChild(el('p',leadDone?null:'lead',t)); leadDone=true;
  });
  if(ways.length){ const w=el('div','way'); w.appendChild(el('div','wh','HOW TO DECIDE')); ways.forEach(t=>w.appendChild(el('div',null,t))); box.appendChild(w); }
  if(notes.length){ const n=el('div','notes'); notes.forEach(t=>n.appendChild(el('div',null,t))); box.appendChild(n); }
  if(!box.childNodes.length) box.textContent=text||'';
  return box;
}
function renderAnswer(text){
  if(/\n/.test(String(text||'').trim())) return renderLines(String(text).trim());
  const box=el('div','ans'); let facts=[], ways=[], notes=[], mode='facts';
  const flush=()=>{ if(!facts.length) return;
    if(facts.length>2){ const ul=el('ul'); facts.forEach(t=>ul.appendChild(el('li',null,t))); box.appendChild(ul); }
    else box.appendChild(el('p',null,facts.join(' ')));
    facts=[]; };
  String(text||'').split(/\n\s*\n/).forEach(block=>{
    block=block.trim(); if(!block) return;
    if(/:$/.test(block) && block.length<200){ flush(); box.appendChild(el('p',null,block)); return; }
    block.split(/(?<=[.?!])\s+(?=[A-Z"“'‘$])/).forEach(t=>{
      t=t.trim(); if(!t) return;
      if(NOTE_RX.test(t)){ mode='notes'; notes.push(t); return; }
      if(WAY_RX.test(t)){ mode='way'; ways.push(t); return; }
      if(mode==='way'){ ways.push(t); return; }
      if(mode==='notes' && !KEY_RX.test(t)){ notes.push(t); return; }
      mode='facts';
      const k=t.match(KEY_RX);
      if(k){ flush(); const p=el('p','key'); p.appendChild(el('b',null,k[1]+' ')); p.appendChild(document.createTextNode(t.slice(k[1].length).trim())); box.appendChild(p); }
      else facts.push(t);
    });
  });
  flush();
  if(ways.length){ const w=el('div','way'); w.appendChild(el('div','wh','HOW TO DECIDE')); w.appendChild(el('div',null,ways.join(' '))); box.appendChild(w); }
  if(notes.length) box.appendChild(el('div','notes',notes.join(' ')));
  if(!box.childNodes.length) box.textContent=text||'';
  return box;
}
async function ask(question){
  if(!question.trim()) return;
  add(el('div','msg you',question)); q.value=''; send.disabled=true;
  const wait = el('div','msg bot'); add(wait);
  const LOAD=['Reading the question…','Pulling filings and market data…','Writing the answer…','Checking every number against its source…'];
  const lrow=el('div','loading'), ltxt=el('span',null,LOAD[0]); lrow.append(el('span','pulse'), ltxt); wait.appendChild(lrow);
  let li=0; const timer=setInterval(()=>{ li=(li+1)%LOAD.length; ltxt.textContent=LOAD[li]; },1600);
  try{
    const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ticker:document.getElementById('ticker').value||'AAPL', question, last_question:lastQuestion})});
    if(!r.ok) throw new Error('Server error '+r.status);
    const d = await r.json(); clearInterval(timer); wait.textContent='';
    try{ const tb=document.getElementById('ticker');
      if(d.ticker && typeof d.ticker==='string' && d.ticker.toUpperCase()!==String(tb.value||'').toUpperCase()) tb.value=d.ticker; }catch(e){}
    const isChat = d.status==='CHAT';
    if(d.status==='ANSWERED' || d.status==='DECLINED_ADVICE') lastQuestion=question;
    try{
      if(isChat) throw 0;
      const nm=[d.company, d.ticker].filter(x=>x&&typeof x==='string').join(' · ');
      const cl=Array.isArray(d.claims)?d.claims:[], bl=Array.isArray(d.blocked)?d.blocked:[];
      if(nm || cl.length){
        const hd=el('div','hd'); hd.appendChild(el('div','co',nm));
        if(cl.length){ const okN=cl.filter(c=>c.status==='VERIFIED').length;
          hd.appendChild(el('span','badge','✓ '+okN+' of '+cl.length+' numbers checked'+(bl.length?' · '+bl.length+(bl.length===1?' sentence':' sentences')+' withheld':''))); }
        wait.appendChild(hd);
      }
    }catch(e){}
    const newsOnly = d.status==='ANSWERED' && !(d.claims||[]).length && (d.news||[]).length;
    wait.appendChild(el('div','status',isChat?'CALLISTO':'CALLISTO · '+(d.kind==='compare'?'SOURCE FIGURES · PRINTED BY CODE':d.kind==='unknown_ticker'?'TICKER NOT FOUND':newsOnly?'HEADLINES · NOT VERIFIED':(LABEL[d.status]||d.status))+(d.checker==='off'?' · CHECKER OFF':'')));
    if(Array.isArray(d.stats) && d.stats.length){
      const g=el('div','tiles');
      d.stats.forEach(s=>{ if(!s) return; const t=el('div','tile'); t.appendChild(el('div','tl',s.label)); t.appendChild(el('div','tv',s.value)); if(s.note) t.appendChild(el('div','tn',s.note)); g.appendChild(t); });
      wait.appendChild(g);
    }
    let ansNode; try{ ansNode=renderAnswer(d.answer); }catch(e){ ansNode=el('div',null,d.answer); }
    wait.appendChild(ansNode);
    (d.charts||[]).forEach(c=>{ try{ wait.appendChild(drawChart(c)); }catch(e){} });
    if(Array.isArray(d.followups)){
      const fu=d.followups.filter(x=>typeof x==='string' && x.trim()).slice(0,3);
      if(fu.length){ const row=el('div','followups'); fu.forEach(t=>{ const b=el('button',null,t); b.type='button'; b.addEventListener('click',()=>ask(t)); row.appendChild(b); }); wait.appendChild(row); }
    }
    if(d.claims && d.claims.length){
      const chips=el('div','chips');
      d.claims.forEach(c=>{ const cls=c.status==='VERIFIED'?'ok':(c.status==='UNCHECKED'?'unchecked':'bad');
        const chip=el('span','chip '+cls,(c.status==='VERIFIED'?'✓ ':c.status==='UNCHECKED'?'? ':'✗ ')+c.text);
        chip.title = c.source || c.note || c.status; chips.appendChild(chip); });
      wait.appendChild(chips);
    }
    (d.blocked||[]).forEach(b=>{ const p=el('div','blocked','Sentence withheld'+(b.status&&b.status!=='BLOCKED'?' ('+b.status+')':'')+(b.note?': '+b.note:''));
      if(b.text){ const det=el('details','meta'); det.appendChild(el('summary',null,'Show withheld text (not confirmed, do not rely on it)')); det.appendChild(el('s',null,b.text)); p.appendChild(det); }
      wait.appendChild(p); });
    if(d.news && d.news.length){
      wait.appendChild(el('div','rephead','AS REPORTED · publisher text, word for word · not checked by Callisto'));
      const ul=el('ul','news');
      d.news.forEach(n=>{ const li=el('li'); const a=el('a',null,n.title||'(untitled)');
        if(n.url && /^https?:\/\//i.test(n.url)){ a.href=n.url; a.target='_blank'; a.rel='noopener noreferrer'; }
        li.appendChild(a); li.appendChild(document.createTextNode(' · '+(n.publisher||'')+' · '+String(n.published_utc||'').slice(0,10)));
        if(n.summary){ li.appendChild(el('div','repsum',n.summary)); }
        ul.appendChild(li); });
      wait.appendChild(ul);
    }
    if(d.agents && d.agents.length){
      wait.appendChild(el('div','meta','Agents: '+d.agents.map(a=>(STEP[a.name]||String(a.name||'').replace(/^specialist_/,''))+(a.status&&a.status!=='ok'?' ('+a.status+')':'')).join(' · ')));
    }
    if(d.council && d.council.members){ const c=d.council, ok=c.members.filter(m=>m.status==='ok').map(m=>m.name||m.model);
      wait.appendChild(el('div','meta',c.used?'Council: '+ok.join(' · ')+' — '+c.agreed+' agreed'+(c.majority?', '+c.majority+' by majority':'')+', '+(c.disputed||[]).length+' disputed':'Council: fewer than two models answered, single writer used')); }
    if(d.sources && d.sources.length){
      wait.appendChild(el('div','meta','Sources: '+d.sources.map(x=>(x.name||'')+(x.status==='ok'?(x.as_of?' (as of '+x.as_of+')':''):' (unavailable: '+(x.reason||'no reason given')+')')).join(' · ')));
    }
    wait.appendChild(el('div','meta',[d.seconds!=null?d.seconds+'s':'',(d.models||[]).join(', '),d.prism_session_id?'PRISM '+d.prism_session_id:''].filter(Boolean).join(' · ')));
  }catch(e){ wait.textContent='Something went wrong: '+e.message; }
  finally{ clearInterval(timer); }
  send.disabled=false; q.focus();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault(); ask(q.value);});
document.querySelectorAll('#examples button').forEach(b=>b.addEventListener('click',()=>ask(b.textContent)));
</script>
